[project]
name = "rust-skill"
version = "0.0.0"
description = "A compact Rust skill catalogue for Codex"
requires-python = ">=3.12"
dependencies = []

# The manifest contract tools are pinned here rather than installed ad hoc, so
# `make lint` validates every skill with the same parser and linter everywhere.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
    "yamllint",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
