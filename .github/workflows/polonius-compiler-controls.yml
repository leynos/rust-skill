name: Polonius compiler controls

on:
  pull_request:
    paths:
      - ".github/workflows/polonius-compiler-controls.yml"
      - "Makefile"
      - "skills/nll-to-polonius/references/fixtures/**"
      - "skills/nll-to-polonius/references/verification.md"
      - "tests/polonius_compile_matrix.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/polonius-compiler-controls.yml"
      - "Makefile"
      - "skills/nll-to-polonius/references/fixtures/**"
      - "skills/nll-to-polonius/references/verification.md"
      - "tests/polonius_compile_matrix.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-27
      - name: Compile the Polonius control matrix
        run: python3 tests/polonius_compile_matrix.py
